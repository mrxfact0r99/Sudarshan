<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudarshan EDR — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0d12;
      --surface:   #13161e;
      --surface2:  #1a1e2a;
      --border:    #252938;
      --accent:    #ffb703;
      --accent2:   #fb8500;
      --red:       #f87171;
      --muted:     #5c6380;
      --text:      #dde1f0;
      --text-soft: #9399b2;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .login-logo {
      font-size: 21px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 12.5px;
      color: var(--text-soft);
      margin-bottom: 6px;
      margin-top: 16px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      outline: none;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--accent);
    }

    .btn-login {
      width: 100%;
      margin-top: 22px;
      background: var(--accent);
      color: #1a1400;
      font-weight: 700;
      font-size: 14px;
      border: none;
      padding: 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-login:hover { background: var(--accent2); }

    .error-box {
      margin-top: 16px;
      background: rgba(248,113,113,.1);
      border: 1px solid rgba(248,113,113,.35);
      color: var(--red);
      font-size: 13px;
      padding: 9px 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <form class="login-card" method="post" action="{{ url_for('login') }}">
    <div class="login-logo"><span>🛡</span> Sudarshan EDR</div>
    <div class="login-sub">Security Console — Sign In</div>

    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>

    <button class="btn-login" type="submit">Sign in</button>
  </form>
</body>
</html>
